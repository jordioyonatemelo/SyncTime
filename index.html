<title>SyncTime</title>
<style>
/* Fonts embedded — no internet required */

:root {
  --bg:        #080c18;
  --panel:     #0d1428;
  --panel2:    #111d38;
  --border:    #1e2e55;
  --border2:   #2a4080;
  --accent:    #00d4ff;
  --accent2:   #0088cc;
  --glow:      rgba(0,212,255,0.18);
  --glow2:     rgba(0,212,255,0.06);
  --text:      #e8f4ff;
  --text2:     #7a9cc8;
  --text3:     #3d5a8a;
  --red:       #ff4466;
  --green:     #00ffaa;
  --amber:     #ffb800;
  --font-disp: 'Courier New', 'Courier', monospace;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
}

/* Noise texture overlay */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 9999; opacity: 0.4;
}

/* ── HEADER ── */
.app-header {
  background: linear-gradient(180deg, #0d1428 0%, rgba(13,20,40,0.95) 100%);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 10px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.app-title-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex: 1;
  min-width: 0;
}
.app-title {
  font-family: var(--font-disp);
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: 0.08em;
  text-shadow: 0 0 20px var(--glow);
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  overflow: hidden;
}
.app-title-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 1;
  min-width: 0;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
@media (max-width: 400px) {
  .app-title { font-size: 1.4rem; letter-spacing: 0.04em; gap: 4px; }
  .app-copy  { font-size: 0.62rem; }
  .utc-badge { font-size: 0.55rem; padding: 3px 7px; }
}
.app-title-dot {
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent);
  animation: blink 2s infinite;
}
@keyframes blink {
  0%,100% { opacity: 1; } 50% { opacity: 0.3; }
}
.utc-badge {
  font-family: var(--font-disp);
  font-size: 0.65rem;
  color: var(--text2);
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  letter-spacing: 0.08em;
}
.utc-badge span { color: var(--accent); }

/* Clock count selector */
.count-selector {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px 0 0;
}
.count-label {
  font-size: 0.7rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.count-pills {
  display: flex;
  gap: 4px;
}
.pill {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: var(--panel2);
  border: 1px solid var(--border);
  color: var(--text2);
  font-family: var(--font-disp);
  font-size: 0.65rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.pill:hover { border-color: var(--border2); color: var(--text); }
.pill.active {
  background: rgba(0,212,255,0.12);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 10px var(--glow);
}

/* ── MAIN ── */
.main {
  padding: 14px 12px 80px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ── CLOCK CARD ── */
.clock-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  transition: all 0.3s;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.clock-card:hover {
  border-color: var(--border2);
  box-shadow: 0 4px 24px rgba(0,212,255,0.06);
}

/* Card top bar */
.card-topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px 6px;
  background: var(--panel2);
  border-bottom: 1px solid var(--border);
}
.city-flag {
  font-size: 1.3rem;
  flex-shrink: 0;
  line-height: 1;
  user-select: none;
}
.card-num {
  font-family: var(--font-disp);
  font-size: 0.55rem;
  color: var(--text3);
  letter-spacing: 0.15em;
  width: 22px;
  flex-shrink: 0;
}

.app-copy {
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--amber);
  letter-spacing: 0.04em;
  margin-top: 1px;
  white-space: nowrap;
}

/* ── CITY SEARCH WIDGET ── */
.city-search-wrapper {
  flex: 1;
  position: relative;
}
.city-search-input {
  width: 100%;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  outline: none;
  caret-color: var(--accent);
  cursor: text;
  padding-right: 20px;
}
.city-search-input::placeholder {
  color: var(--text3);
  font-weight: 400;
}
.city-search-input::-webkit-search-cancel-button { display: none; }

.search-arrow {
  position: absolute;
  right: 0; top: 50%;
  transform: translateY(-50%);
  color: var(--text3);
  pointer-events: none;
  font-size: 10px;
  transition: transform 0.2s;
}
.search-arrow.open { transform: translateY(-50%) rotate(180deg); }

/* Dropdown list */
.city-dropdown {
  display: none;
  position: fixed;
  left: 0;
  right: 0;
  background: #0d1830;
  border-top: 1px solid var(--border2);
  border-radius: 14px 14px 0 0;
  z-index: 5000;
  max-height: calc(100vh - 130px);
  overflow-y: auto;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.7);
  scroll-behavior: smooth;
}
.city-dropdown.open { display: block; animation: sheetUp 0.22s ease; }
@keyframes sheetUp {
  from { transform: translateY(30px); opacity: 0; }
  to   { transform: translateY(0);    opacity: 1; }
}
.dd-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 4999;
  backdrop-filter: blur(2px);
}
.dd-backdrop.open { display: block; }
.city-dropdown::-webkit-scrollbar { width: 4px; }
.city-dropdown::-webkit-scrollbar-track { background: transparent; }
.city-dropdown::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.dd-handle {
  width: 36px; height: 4px;
  background: var(--border2);
  border-radius: 2px;
  margin: 10px auto 6px;
}
.dd-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px 10px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: #0d1830;
  z-index: 1;
}
.dd-search-box {
  flex: 1;
  background: var(--panel2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 0.9rem;
  padding: 8px 12px;
  outline: none;
  caret-color: var(--accent);
}
.dd-search-box::placeholder { color: var(--text3); }
.dd-close-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--text2);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 0.8rem;
  cursor: pointer;
  margin-left: 8px;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.dd-region {
  padding: 6px 12px 3px;
  font-family: var(--font-disp);
  font-size: 0.5rem;
  color: var(--text3);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 48px;
}
.dd-item {
  padding: 9px 14px;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid rgba(30,46,85,0.4);
  transition: background 0.1s, color 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.dd-item:last-child { border-bottom: none; }
.dd-item:hover, .dd-item.focused {
  background: rgba(0,212,255,0.08);
  color: var(--text);
}
.dd-item.selected {
  color: var(--accent);
  background: rgba(0,212,255,0.05);
}
.dd-item .dd-flag { font-size: 1.1rem; flex-shrink: 0; }
.dd-item .dd-name { flex: 1; }
.dd-item .dd-utc  {
  font-family: var(--font-disp);
  font-size: 0.5rem;
  color: var(--text3);
  letter-spacing: 0.06em;
}
.dd-empty {
  padding: 20px 14px;
  text-align: center;
  color: var(--text3);
  font-size: 0.75rem;
  font-family: var(--font-body);
}
.dd-highlight {
  color: var(--accent);
}

/* UTC offset badge */
.utc-offset {
  font-family: var(--font-disp);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  padding: 3px 8px;
  border-radius: 20px;
  background: rgba(0,212,255,0.08);
  border: 1px solid rgba(0,212,255,0.2);
  color: var(--accent);
  flex-shrink: 0;
  white-space: nowrap;
  min-width: 56px;
  text-align: center;
}
.utc-offset.neg { color: #ff8866; background: rgba(255,136,102,0.08); border-color: rgba(255,136,102,0.2); }
.utc-offset.zero { color: var(--green); background: rgba(0,255,170,0.08); border-color: rgba(0,255,170,0.2); }

/* Digital clock display */
.clock-display {
  padding: 10px 14px 8px;
  position: relative;
  overflow: hidden;
}
.clock-display::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.04) 0%, transparent 70%);
  pointer-events: none;
}

.time-digits {
  font-family: var(--font-disp);
  font-size: 2.2rem;
  font-weight: 900;
  color: var(--text);
  letter-spacing: 0.04em;
  line-height: 1;
  text-shadow: 0 0 30px rgba(0,212,255,0.3);
  display: flex;
  align-items: baseline;
  gap: 2px;
}
.time-sep {
  color: var(--accent);
  animation: sepBlink 1s step-end infinite;
  display: inline-block;
  margin: 0 1px;
}
@keyframes sepBlink {
  0%,100% { opacity: 1; } 50% { opacity: 0.15; }
}
.time-seconds {
  font-size: 0.95rem;
  color: var(--text2);
  font-weight: 400;
  margin-left: 4px;
  align-self: flex-end;
  padding-bottom: 4px;
}
.time-ampm {
  font-size: 0.75rem;
  color: var(--text3);
  font-weight: 400;
  margin-left: 6px;
  align-self: flex-end;
  padding-bottom: 6px;
  letter-spacing: 0.1em;
}

.clock-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 5px;
}
.clock-date {
  font-family: var(--font-body);
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--text2);
  letter-spacing: 0.06em;
}
.clock-diff {
  font-family: var(--font-disp);
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  color: var(--text3);
}
.clock-diff .diff-val {
  color: var(--amber);
}

/* Scan line effect */
.scan-line {
  position: absolute;
  left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,212,255,0.15), transparent);
  animation: scan 4s linear infinite;
  pointer-events: none;
}
@keyframes scan {
  0%   { top: -2px; }
  100% { top: 100%; }
}

/* ── INSTALL BANNER ── */
.install-banner {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--panel2);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 200;
  animation: slideUp 0.4s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.install-banner.hidden { display: none; }
.install-text {
  flex: 1;
  font-size: 0.8rem;
  color: var(--text2);
}
.install-text strong { color: var(--text); display: block; font-size: 0.85rem; }
.install-btn {
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 8px;
  padding: 8px 16px;
  font-family: var(--font-disp);
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  cursor: pointer;
  white-space: nowrap;
}
.install-close {
  background: none;
  border: none;
  color: var(--text3);
  font-size: 1.2rem;
  cursor: pointer;
  padding: 4px;
}

/* ── MENU BUTTON ── */
.menu-btn {
  background: rgba(0,212,255,0.06);
  border: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  padding: 8px 10px;
  border-radius: 8px;
  transition: background 0.15s, border-color 0.15s;
  flex-shrink: 0;
  min-width: 38px;
  min-height: 36px;
}
.menu-btn:hover { background: rgba(0,212,255,0.08); }
.menu-btn span {
  display: block;
  width: 20px; height: 2px;
  background: var(--text2);
  border-radius: 2px;
  transition: background 0.15s;
}
.menu-btn:hover span { background: var(--accent); }

/* ── DROPDOWN MENU ── */
.app-menu {
  position: fixed;
  top: 60px; right: 12px;
  background: #0d1830;
  border: 1px solid var(--border2);
  border-radius: 12px;
  min-width: 180px;
  z-index: 9000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7);
  overflow: hidden;
  display: none;
  animation: menuFadeIn 0.15s ease;
}
@keyframes menuFadeIn {
  from { opacity:0; transform: translateY(-6px) scale(0.97); }
  to   { opacity:1; transform: translateY(0)   scale(1); }
}
.app-menu.open { display: block; }
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s, color 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.menu-item:last-child { border-bottom: none; }
.menu-item:hover { background: rgba(0,212,255,0.07); color: var(--text); }
.menu-icon { font-size: 1.1rem; flex-shrink: 0; }

/* ── MODAL OVERLAY ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 8000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  display: none;
}
.modal-overlay.open { display: flex; animation: overlayIn 0.2s ease; }
@keyframes overlayIn {
  from { opacity: 0; } to { opacity: 1; }
}
.modal {
  background: #0d1428;
  border: 1px solid var(--border2);
  border-radius: 18px;
  width: 100%;
  max-width: 340px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn {
  from { transform: translateY(20px) scale(0.96); opacity:0; }
  to   { transform: translateY(0)    scale(1);    opacity:1; }
}
.modal-header {
  background: var(--panel2);
  border-bottom: 1px solid var(--border);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title {
  font-family: var(--font-disp);
  font-size: 0.75rem;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.modal-close {
  background: none;
  border: none;
  color: var(--text3);
  font-size: 1.3rem;
  cursor: pointer;
  line-height: 1;
  padding: 2px 6px;
  border-radius: 6px;
  transition: color 0.1s, background 0.1s;
}
.modal-close:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.modal-body { padding: 24px 20px; }
.modal-footer {
  padding: 0 20px 20px;
  display: flex;
  justify-content: center;
}
.btn-cerrar {
  background: rgba(0,212,255,0.12);
  border: 1px solid var(--accent);
  color: var(--accent);
  border-radius: 10px;
  padding: 10px 40px;
  font-family: var(--font-disp);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-cerrar:hover { background: rgba(0,212,255,0.22); }

/* ── ABOUT modal ── */
.about-icon {
  width: 96px; height: 96px;
  border-radius: 22px;
  display: block;
  margin: 0 auto 14px;
  box-shadow: 0 6px 24px rgba(0,0,0,0.6);
}
.about-app-name {
  font-family: var(--font-disp);
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--accent);
  text-align: center;
  letter-spacing: 0.1em;
  text-shadow: 0 0 16px var(--glow);
  margin-bottom: 4px;
}
.about-title {
  font-family: var(--font-body);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text2);
  text-align: center;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.about-copy {
  font-family: var(--font-body);
  font-size: 0.82rem;
  color: var(--text3);
  text-align: center;
  letter-spacing: 0.04em;
}

/* ── SETTINGS modal ── */
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-label {
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text2);
}
.setting-sub {
  font-size: 0.7rem;
  color: var(--text3);
  margin-top: 2px;
  font-family: var(--font-body);
}
/* Toggle switch */
.format-toggle {
  display: flex;
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.fmt-btn {
  padding: 7px 14px;
  font-family: var(--font-disp);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  color: var(--text3);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.fmt-btn.active {
  background: rgba(0,212,255,0.15);
  color: var(--accent);
}


/* Offline indicator */
.offline-bar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #7c3f00;
  border-top: 1px solid #ff8c00;
  color: #ffcc66;
  text-align: center;
  padding: 8px;
  font-family: var(--font-body);
  font-size: 0.8rem;
  z-index: 99999;
}
.offline-bar.show { display: block; }

</style>
</head>
<body>

<div class="dd-backdrop" id="ddBackdrop" onclick="closeAllDropdowns()"></div>

<div class="app-header">
  <div class="header-row">
    <div class="app-title-block">
      <div class="app-title">
        <span class="app-title-dot"></span>
        <span class="app-title-text">SyncTime</span>
      </div>
      <div class="app-copy">&copy; J. Oyonate</div>
    </div>
    <div class="header-right">
      <div class="utc-badge">UTC <span id="utcNow">--:--</span></div>

      <span class="menu-icon">&#9881;&#65039;</span> Configuraci&oacute;n
    </div>
    <div class="menu-item" onclick="openModal('aboutModal')">
      <span class="menu-icon">&#8505;&#65039;</span> Acerca de&hellip;
    </div>

      <button class="pill" data-n="5" onclick="setCount(5)">5</button>
      <button class="pill" data-n="6" onclick="setCount(6)">6</button>
      <button class="pill" data-n="7" onclick="setCount(7)">7</button>
      <button class="pill" data-n="8" onclick="setCount(8)">8</button>
      <button class="pill" data-n="9" onclick="setCount(9)">9</button>

</div>

<div class="main" id="clocksContainer"></div>

<!-- ── SETTINGS MODAL ── -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">

      <div class="setting-row">

          <div class="setting-label">Formato de hora</div>

<!-- ── ABOUT MODAL ── -->
<div class="modal-overlay" id="aboutModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">ℹ ACERCA DE</span>
      <button class="modal-close" onclick="closeModal('aboutModal')">✕</button>

function getCityObj(name) {
  return CITIES.find(c => c.c === name);
}

function getUTCOffset(tz) {
  try {
    const now = new Date();
    const formatter = new Intl.DateTimeFormat('en-US', {
      timeZone: tz,
      timeZoneName: 'shortOffset'
    });
    const parts = formatter.formatToParts(now);
    const tzName = parts.find(p => p.type === 'timeZoneName')?.value || '';
    // shortOffset gives "GMT+2", "GMT-5", "GMT" etc
    const match = tzName.match(/GMT([+-]\d+(?::\d+)?)?/);
    if (!match) return { hours: 0, str: 'UTC+0' };
    const raw = match[1] || '';
    if (!raw) return { hours: 0, str: 'UTC+0' };
    const [h, m] = raw.split(':');
    const hours = parseInt(h);
    const mins  = parseInt(m || '0');
    const total = hours + (hours >= 0 ? mins/60 : -mins/60);
    const sign  = total >= 0 ? '+' : '';
    const label = mins ? `UTC${sign}${hours}:${String(mins).padStart(2,'0')}` : `UTC${sign}${hours}`;
    return { hours: total, str: label };
  } catch { return { hours: 0, str: 'UTC+0' }; }
}

function getTimeInTZ(tz) {
  try {
    const now = new Date();
    const fmt = (part) => new Intl.DateTimeFormat('es-ES', { timeZone: tz, [part]: '2-digit' }).format(now);
    const h24raw = parseInt(new Intl.DateTimeFormat('es-ES', { timeZone: tz, hour: '2-digit', hour12: false }).format(now));
    const h12    = h24raw % 12 || 12;
    const ampm   = h24raw >= 12 ? 'PM' : 'AM';
    // Always 2 digits — force padStart regardless of locale
    const mins = String(parseInt(fmt('minute'))).padStart(2, '0');
    const secs = String(parseInt(fmt('second'))).padStart(2, '0');
    const hDisplay = hourFormat === 24
      ? String(h24raw).padStart(2, '0')
      : String(h12).padStart(2, '0');

    const dateStr = new Intl.DateTimeFormat('es-ES', {
      timeZone: tz,
      weekday: 'short', day: '2-digit', month: 'short', year: 'numeric'
    }).format(now);

    return {
      h: hDisplay,
      m: mins,
      s: secs,
      ampm: hourFormat === 24 ? '' : ampm,
      date: dateStr
    };
  } catch {
    return { h: '--', m: '--', s: '--', ampm: '', date: '---' };
  }
}

function getUTCString() {
  const now = new Date();
  const h = String(now.getUTCHours()).padStart(2, '0');
  const m = String(now.getUTCMinutes()).padStart(2, '0');
  const s = String(now.getUTCSeconds()).padStart(2, '0');
  return `${h}:${m}:${s}`;
}

// CITY SEARCH WIDGET

// Flatten cities for search (exclude region headers)
const CITY_LIST = CITIES.filter(c => c.c);

function getCityFlag(cityName) {
  const found = CITY_LIST.find(c => c.c === cityName);
  return found ? found.cc : '🌍';
}

function normalize(str) {
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // remove accents
}

function getUTCOffsetLabel(tz) {
  try {
    const now = new Date();
    const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(now);
    const tn = parts.find(p => p.type === 'timeZoneName')?.value || 'GMT';
    return tn.replace('GMT', 'UTC') || 'UTC+0';
  } catch { return 'UTC'; }
}

function buildDropdownHTML(idx, query, selectedCity) {
  const q = normalize(query || '');
  let listHTML = '';

  function itemHTML(cityObj) {
    const isSel = cityObj.c === selectedCity ? ' selected' : '';
    const utcLbl = getUTCOffsetLabel(cityObj.tz);
    // Store index in data attr and use onclick with dataset to avoid quote escaping
    return '<div class="dd-item' + isSel + '" '
      + 'data-city="' + cityObj.c.replace(/"/g, '&quot;') + '" '
      + 'data-idx="' + idx + '" '
      + 'onclick="ddPick(this,' + idx + ')">'
      + '<span class="dd-flag">' + cityObj.cc + '</span>'
      + '<span class="dd-name">' + cityObj.c + '</span>'
      + '<span class="dd-utc">'  + utcLbl    + '</span>'
      + '</div>';
  }

  if (q) {
    const filtered = CITY_LIST.filter(c => normalize(c.c).includes(q));
    if (filtered.length === 0) {
      listHTML = '<div class="dd-empty">Sin resultados para "' + query + '"</div>';
    } else {
      filtered.forEach(c => { listHTML += itemHTML(c); });
    }
  } else {
    CITIES.forEach(entry => {
      if (entry.r) {
        listHTML += '<div class="dd-region">' + entry.r + '</div>';
      } else {
        listHTML += itemHTML(entry);
      }
    });
  }

  const header = '<div class="dd-handle"></div>'
    + '<div class="dd-header">'
    + '<input class="dd-search-box" id="ddSearch-' + idx + '" type="search" '
    + 'placeholder="Buscar ciudad..." autocomplete="off" autocorrect="off" spellcheck="false" '
    + 'value="' + query + '" '
    + 'oninput="filterFromSheet(' + idx + ', this.value)" />'
    + '<button class="dd-close-btn" onclick="closeSearch(' + idx + ')">Cerrar</button>'
    + '</div>';

  return header + listHTML;
}

// Delegate pick from dropdown — reads city from data attribute (safe with any char)
function ddPick(el, idx) {
  const cityName = el.dataset.city;
  if (cityName) pickCity(idx, cityName);
}

function openSearch(idx) {
  closeAllDropdowns();
  const dd  = document.getElementById(`cityDD-${idx}`);
  const inp = document.getElementById(`cityInput-${idx}`);
  const arr = document.getElementById(`cityArrow-${idx}`);
  const bk  = document.getElementById('ddBackdrop');
  if (!dd || !inp) return;
  inp.value = '';
  dd.innerHTML = buildDropdownHTML(idx, '', selectedCities[idx]);
  // Position: attach to bottom of viewport
  dd.style.bottom = '0';
  dd.style.top = 'auto';
  dd.classList.add('open');
  if (arr) arr.classList.add('open');
  if (bk) bk.classList.add('open');
  // Focus the search box inside the sheet
  setTimeout(() => {
    const searchBox = document.getElementById(`ddSearch-${idx}`);
    if (searchBox) searchBox.focus();
    const sel = dd.querySelector('.selected');
    if (sel) sel.scrollIntoView({ block: 'center' });
  }, 80);
}

function closeAllDropdowns() {
  for (let i = 0; i < 6; i++) closeSearch(i);
  const bk = document.getElementById('ddBackdrop');
  if (bk) bk.classList.remove('open');
}

function closeSearch(idx) {
  const dd  = document.getElementById(`cityDD-${idx}`);
  const inp = document.getElementById(`cityInput-${idx}`);
  const arr = document.getElementById(`cityArrow-${idx}`);
  if (!dd) return;
  dd.classList.remove('open');
  if (arr) arr.classList.remove('open');
  if (inp) inp.value = selectedCities[idx] || '';
  // Hide backdrop only if no other dropdown is open
  const anyOpen = [...document.querySelectorAll('.city-dropdown.open')].length > 0;
  if (!anyOpen) {
    const bk = document.getElementById('ddBackdrop');
    if (bk) bk.classList.remove('open');
  }
}

function filterCities(idx) {
  const inp = document.getElementById(`cityInput-${idx}`);
  if (!inp) return;
  // Tap on input bar opens the full sheet
  if (!document.getElementById(`cityDD-${idx}`)?.classList.contains('open')) {
    openSearch(idx);
  }
}

function filterFromSheet(idx, query) {
  const dd = document.getElementById(`cityDD-${idx}`);
  if (!dd) return;
  // Rebuild only the list part, keep header
  const header = dd.querySelector('.dd-header')?.parentElement;
  // Re-render entire dropdown content preserving scroll position
  const scrollTop = dd.scrollTop;
  dd.innerHTML = buildDropdownHTML(idx, query, selectedCities[idx]);
  dd.scrollTop = 0;
  // Re-focus search box
  const sb = document.getElementById(`ddSearch-${idx}`);
  if (sb) { sb.focus(); sb.value = query; sb.setSelectionRange(query.length, query.length); }
}

function pickCity(idx, cityName) {
  selectedCities[idx] = cityName;
  const inp  = document.getElementById(`cityInput-${idx}`);
  const flag = document.getElementById(`cityFlag-${idx}`);
  if (inp)  inp.value = cityName;
  if (flag) flag.textContent = CITY_LIST.find(c => c.c === cityName)?.cc || '🌍';
  closeSearch(idx);
  tick();
}

// Backdrop handles outside-tap via onclick; keyboard Escape closes too
document.addEventListener('keydown', e => {

// ═══════════════════════════════════════════════════════
// RENDER CLOCKS
// ═══════════════════════════════════════════════════════
function renderClocks() {
  const container = document.getElementById('clocksContainer');
  while (container.children.length > clockCount) container.removeChild(container.lastChild);
  while (container.children.length < clockCount) {
    const idx = container.children.length;
    const card = document.createElement('div');
    card.className = 'clock-card';
    card.id = `card-${idx}`;
    card.innerHTML = buildCardHTML(idx);
    container.appendChild(card);
  }
  tick();
}

function buildCardHTML(idx) {
  const city = selectedCities[idx] || DEFAULT_CITIES[idx] || 'Madrid';
  return `
    <div class="card-topbar">
      <span class="card-num">${String(idx+1).padStart(2,"0")}</span>
      <span class="city-flag" id="cityFlag-${idx}">${getCityFlag(city)}</span>
      <div class="city-search-wrapper" id="searchWrap-${idx}">
        <input
          type="search"
          class="city-search-input"
          id="cityInput-${idx}"
          value="${city}"
          placeholder="Buscar ciudad..."
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          onclick="openSearch(${idx})"
          oninput="filterCities(${idx})"
          onkeydown="handleSearchKey(event,${idx})"
        />
        <span class="search-arrow" id="cityArrow-${idx}" onclick="openSearch(${idx})">▾</span>
        <div class="city-dropdown" id="cityDD-${idx}" data-idx="${idx}"></div>
      </div>
      <span class="utc-offset" id="utcOffset-${idx}">UTC+0</span>
    </div>
    <div class="clock-display">
      <div class="scan-line"></div>
      <div class="time-digits">
        <span id="th-${idx}">--</span>
        <span class="time-sep">:</span>
        <span id="tm-${idx}">--</span>
        <span class="time-seconds" id="ts-${idx}">--</span>
        <span class="time-ampm"  id="ta-${idx}"></span>
      </div>
      <div class="clock-meta">
        <div class="clock-date" id="td-${idx}">---</div>
        <div class="clock-diff" id="tdiff-${idx}"></div>
      </div>
    </div>`;
}

// Keyboard nav in dropdown
function handleSearchKey(e, idx) {
  const dd = document.getElementById(`cityDD-${idx}`);
  if (!dd || !dd.classList.contains('open')) return;
  const items = [...dd.querySelectorAll('.dd-item')];
  if (!items.length) return;
  const focused = dd.querySelector('.dd-item.focused');
  let fi = items.indexOf(focused);
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (focused) focused.classList.remove('focused');
    fi = (fi + 1) % items.length;
    items[fi].classList.add('focused');
    items[fi].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (focused) focused.classList.remove('focused');
    fi = (fi - 1 + items.length) % items.length;
    items[fi].classList.add('focused');
    items[fi].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const target = focused || items[0];
    if (target) pickCity(idx, target.dataset.city);
  } else if (e.key === 'Escape') {
    closeSearch(idx);
  }
}

// ═══════════════════════════════════════════════════════
// TICK — updates all displayed times
// ═══════════════════════════════════════════════════════
function tick() {
  document.getElementById('utcNow').textContent = getUTCString();

  const utcOffsetNow = new Date().getTimezoneOffset() / -60; // local offset in hrs

  for (let i = 0; i < clockCount; i++) {
    const cityName = selectedCities[i] || DEFAULT_CITIES[i] || 'Madrid';
    const cityObj  = getCityObj(cityName);
    if (!cityObj) continue;

    const t   = getTimeInTZ(cityObj.tz);
    const utc = getUTCOffset(cityObj.tz);

    // Time digits
    const th = document.getElementById(`th-${i}`);
    const tm = document.getElementById(`tm-${i}`);
    const ts = document.getElementById(`ts-${i}`);
    const ta = document.getElementById(`ta-${i}`);
    const td = document.getElementById(`td-${i}`);
    const toff = document.getElementById(`utcOffset-${i}`);
    const tdiff = document.getElementById(`tdiff-${i}`);

    if (th) th.textContent = t.h;
    if (tm) tm.textContent = t.m;
    if (ts) ts.textContent = ':' + t.s;
    if (ta) ta.textContent = t.ampm;
    if (td) td.textContent = t.date;

    if (toff) {
      toff.textContent = utc.str;
      toff.className = 'utc-offset' + (utc.hours > 0 ? '' : utc.hours < 0 ? ' neg' : ' zero');
    }

    // Diff vs local
    if (tdiff) {
      const localOff = -new Date().getTimezoneOffset() / 60;
      const diff = utc.hours - localOff;
      if (diff === 0) {
        tdiff.innerHTML = '<span class="diff-val">= hora local</span>';
      } else {
        const sign = diff > 0 ? '+' : '';
        const h = Math.floor(Math.abs(diff));
        const m = Math.round((Math.abs(diff) - h) * 60);
        const label = m ? `${h}h ${m}m` : `${h}h`;
        tdiff.innerHTML = `vs local <span class="diff-val">${sign}${diff >= 0 ? '' : ''}${sign}${label}</span>`;
      }
    }
  }
}

const STORAGE_KEY = 'multihorario_state_v2';

function saveState() {
  try {
    const data = {
      clockCount: clockCount,
      selectedCities: selectedCities.slice(0, 6),
      hourFormat: hourFormat
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

    // Guardar en CapacitorStorage para el widget nativo de Android
    if (window.Capacitor && window.Capacitor.isNativePlatform()) {
      const { Preferences } = window.Capacitor.Plugins;
      if (Preferences) {
        Preferences.set({
          key: 'multihorario_state_v2',
          value: JSON.stringify(data)
        });
      }
    }
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s.clockCount && s.clockCount >= 1 && s.clockCount <= 10) {
      clockCount = s.clockCount;
    }
    if (Array.isArray(s.selectedCities)) {
      s.selectedCities.forEach((city, i) => {
        if (city && CITY_LIST.find(c => c.c === city)) {
          selectedCities[i] = city;
        }
      });
    }
    if (s.hourFormat === 12 || s.hourFormat === 24) {
      hourFormat = s.hourFormat;
    }
    return true;
  } catch(e) { return false; }
}

// ── SERVICE WORKER (archivo real ./sw.js) ──────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    // Detectar base path automáticamente (funciona en GitHub Pages y Netlify)
    var swPath = (function() {
      var scripts = document.querySelectorAll('script[src]');
      var base = location.pathname.replace(/\/[^\/]*$/, '/');
      return base + 'sw.js';
    })();
    var scope = location.pathname.replace(/\/[^\/]*$/, '/') || '/';
    navigator.serviceWorker.register('./sw.js', {scope: scope})
      .then(function(reg) {
        console.log('[SW] registrado OK, scope:', reg.scope);
      })
      .catch(function(err) {
        console.warn('[SW] error:', err);
      });
  });
}

// ── INDICADOR OFFLINE ──────────────────────────────────
(function() {
  function checkOnline() {
    var bar = document.getElementById('offlineBar');
    if (!bar) return;
    bar.classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online',  checkOnline);
  window.addEventListener('offline', checkOnline);
  document.addEventListener('DOMContentLoaded', checkOnline);
})();

// ── PWA INSTALL PROMPT ─────────────────────────────────
var _prompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  _prompt = e;
  var b = document.getElementById('installBanner');
  if (b) b.classList.remove('hidden');
});
function installApp() {
  if (!_prompt) return;
  _prompt.prompt();
  _prompt.userChoice.then(function() {
    _prompt = null;
    var b = document.getElementById('installBanner');
    if (b) b.classList.add('hidden');
  });
}
function dismissInstall() {
  var b = document.getElementById('installBanner');
  if (b) b.classList.add('hidden');
}
window.addEventListener('appinstalled', function() {
  var b = document.getElementById('installBanner');
  if (b) b.classList.add('hidden');
});

</script>
